name: Build Saverz Rust Release Binary

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Build Release Binary
        run: |
          cargo build --release
          strip target/release/saverz_shop

      - name: Upload Binary as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saverz_shop-linux-amd64
          path: target/release/saverz_shop

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Saverz Shop Production Binary v1.0.0
          draft: false
          prerelease: false
          files: target/release/saverz_shop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
